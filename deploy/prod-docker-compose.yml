version: '3.8'

# ==========================================
# 客流诊断预警系统 - 生产部署 (SQLite + Nginx)
# 部署到腾讯云 CVM 162.14.103.108
# ==========================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flow_backend
    restart: unless-stopped
    environment:
      APP_SECRET_KEY: babc2fa1296ca6cde83521c980787453ca93181503447d66a9b6809ec620a9bc
      APP_ENV: production
    volumes:
      - ./backend/flow_warning.db:/app/flow_warning.db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.26-alpine
    container_name: flow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html/flow-profile
    depends_on:
      - backend
